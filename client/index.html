<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a5f" />
    <link rel="stylesheet" href="https://cdn.quilljs.com/1.3.6/quill.snow.css" />
    <title>InfraFlow ERP</title>
  </head>
  <body>
    <div id="demo-banner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:9999; background:#f59e0b; color:#1e3a5f; padding:8px 16px; text-align:center; font-weight:600; font-size:13px; font-family:sans-serif; box-shadow:0 2px 8px rgba(0,0,0,0.2);">
      DEMO - Date fictive pentru prezentare. Reset zilnic automat la 03:00.
      &nbsp;&nbsp;|&nbsp;&nbsp; Director: <strong>director</strong>/<strong>demo123</strong>
      &nbsp;&nbsp; Admin demo: <strong>demo</strong>/<strong>demo123</strong>
      &nbsp;&nbsp; Kiosk sofer: <strong>sofer1</strong>/<strong>demo123</strong>
    </div>
    <script>
      ;(function () {
        function showDemoBanner() {
          var banner = document.getElementById('demo-banner')
          if (!banner) return
          banner.style.display = 'block'
          document.body.style.paddingTop = '40px'
        }
        if (window.INFRAFLOW_DEMO === true || localStorage.getItem('infraflow_demo') === 'true') {
          showDemoBanner()
        }
        fetch('/api/demo-status')
          .then(function (response) { return response.json() })
          .then(function (data) {
            if (data && data.demo) {
              localStorage.setItem('infraflow_demo', 'true')
              showDemoBanner()
            }
          })
          .catch(function () {})
      })()
    </script>
    <div id="root"></div>
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
